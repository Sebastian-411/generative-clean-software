<!doctype html>
<!-- Herramienta de calibración: muestra un modelo (ya normalizado con fitObject) desde 4 lados
     para decidir los planos de cámara. Uso: sirve el proyecto y abre tools/turntable.html?model=<ruta-al-glb>&size=3&draco=<ruta-a-draco/> -->
<html><head><meta charset="utf-8"><title>Turntable</title>
<style>html,body{margin:0;background:#222;color:#fff;font:12px monospace}#g{display:grid;grid-template-columns:1fr 1fr;width:1400px}canvas{width:700px;height:420px;display:block}.c{position:relative}.c span{position:absolute;left:8px;top:6px}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head><body><div id="g"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { fitObject } from "../scroll-scene/scene.js";
const q = new URLSearchParams(location.search);
const size = +(q.get("size") || 4);
const gltf = await new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath(q.get("draco") || "https://www.gstatic.com/draco/versioned/decoders/1.5.7/")).loadAsync(q.get("model"));
const obj = fitObject(gltf.scene, { size });
const box = new THREE.Box3().setFromObject(obj), dims = box.getSize(new THREE.Vector3());
const views = { "+X (derecha)": [1, 0.35, 0], "-X (izquierda)": [-1, 0.35, 0], "+Z (frente?)": [0, 0.35, 1], "-Z (atrás?)": [0, 0.35, -1] };
for (const [name, d] of Object.entries(views)) {
  const div = document.createElement("div"); div.className = "c";
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(700, 420);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x333333);
  scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(obj.clone()); scene.add(new THREE.AxesHelper(size * 0.6)); scene.add(new THREE.GridHelper(size * 3, 12));
  const cam = new THREE.PerspectiveCamera(35, 700 / 420, 0.01, 100);
  cam.position.set(...d).normalize().multiplyScalar(size * 2.2); cam.position.y += dims.y / 2; cam.lookAt(0, dims.y / 2, 0);
  r.render(scene, cam);
  div.append(r.domElement); const s = document.createElement("span"); s.textContent = name + `  dims ${dims.x.toFixed(2)} × ${dims.y.toFixed(2)} × ${dims.z.toFixed(2)}`; div.append(s);
  document.getElementById("g").append(div);
}
const names = []; gltf.scene.traverse((o) => o.isMesh && names.push(o.name)); console.log("meshes:", names.join(", "));
document.body.dataset.ready = "1";
</script></body></html>
